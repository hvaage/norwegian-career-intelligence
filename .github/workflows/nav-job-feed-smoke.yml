name: NAV job feed smoke test

on:
  workflow_dispatch:
  schedule:
    # Verify daily that the NAV vacancy feed can be downloaded.
    - cron: "20 6 * * *"

jobs:
  nav-job-feed-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NAV_FEED_BASE_URL: https://pam-stilling-feed.nav.no
      NAV_FEED_USE_PUBLIC_TOKEN: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Smoke test NAV feed
        run: python scripts/test_nav_feed.py
